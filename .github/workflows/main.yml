name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Configurar Java (Requisito de Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Instalar Flet
        run: pip install flet
          
      - name: Compilar APK
        run: yes | flet build apk
        
      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: app-dichato-apk
          path: build/apk/**/*.apk
